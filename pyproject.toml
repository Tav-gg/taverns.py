[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "taverns.py"
version = "0.3.0"
description = "Python SDK for building Tavern bots"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.4",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest>=8"]
voice = ["livekit>=1.0"]

[tool.setuptools.packages.find]
include = ["taverns*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
